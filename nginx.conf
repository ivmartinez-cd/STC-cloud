worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ─── Logging ─────────────────────────────────────────────────────────────
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # Ocultar versión de nginx
  server_tokens off;

  # Límites de request
  client_max_body_size 2m;

  # DNS embebido de Docker — necesario para que `proxy_pass` con variable
  # (ver bloques de abajo) vuelva a resolver `api`/`portal` cada 10s en vez
  # de resolverlos UNA sola vez al arrancar nginx. Sin esto, con >1 réplica
  # de `api` (Fase 16 del gap analysis, `API_REPLICAS` en
  # `.env.production`) nginx fija para siempre la IP que le tocó a la
  # primera resolución — nunca reparte entre réplicas nuevas, y un restart
  # de cualquier contenedor (IP nueva) deja 502 hasta un `nginx -s reload`
  # manual. Con la variable, cada request vuelve a resolver: reparte entre
  # réplicas y sobrevive restarts sin intervención.
  resolver 127.0.0.11 valid=10s;

  # Rate limit para rutas de autenticación
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

  # ─── HTTP → HTTPS redirect ──────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Certbot ACME challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── HTTPS principal ────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    # IMPORTANTE: Reemplazar con tu dominio real
    server_name stc-cloud.tu-dominio.com;

    # Certificados Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/stc-cloud.tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stc-cloud.tu-dominio.com/privkey.pem;

    # Protocolos y cifrado
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # SSL session cache
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    # Sin resolver externo propio acá: el `resolver 127.0.0.11` del bloque
    # `http` (DNS embebido de Docker) alcanza este server block por
    # herencia. Un `resolver` declarado en este nivel lo REEMPLAZA (no lo
    # complementa) para todo el bloque, rompiendo el proxy_pass dinámico a
    # portal/api (ver comentario junto al resolver de arriba) — se
    # encontró así en el primer despliegue real (10/09/2026): nginx
    # resolvía "portal" contra Google DNS y daba 502 "Host not found".

    # ─── Security headers ────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"    always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self'" always;

    # ─── Portal web (frontend React) ─────────────────────────────────────
    location / {
      set                $portal_upstream portal:80;
      proxy_pass         http://$portal_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Paquetes de actualización del agente (Fase 1 OTA multi-canal,
    #     10/09/2026, ver docs/dev/TECH_DEBT.md UPD-1) ───────────────────────
    # Archivos estáticos publicados por installer/publish-release.sh — bundle.js
    # y stc-update.zip firmados (Ed25519, ver agent/src/core/UpdateService.ts),
    # servidos desde acá además de GitHub Releases para no depender de que la
    # red del cliente llegue a github.com.
    location /updates/ {
      alias /var/www/updates/;
      add_header Cache-Control "no-cache";
    }

    # ─── API REST ────────────────────────────────────────────────────────
    location /api/ {
      set                $api_upstream api:3000;
      proxy_pass         http://$api_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Auth routes — strict rate limit ─────────────────────────────────
    location ~ ^/api/v1/(portal/login|agents/activate) {
      limit_req zone=auth_zone burst=5 nodelay;

      set                $api_upstream api:3000;
      proxy_pass         http://$api_upstream;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket hub ───────────────────────────────────────────────────
    location /ws {
      set                     $api_upstream api:3000;
      proxy_pass              http://$api_upstream;
      proxy_http_version     1.1;
      proxy_set_header       Upgrade    $http_upgrade;
      proxy_set_header       Connection "upgrade";
      proxy_set_header       Host       $host;
      proxy_read_timeout     86400;
    }

    # ─── Grafana (Fase 17 del gap analysis, opcional — perfil `observability`
    #     de docker-compose.prod.yml) ─────────────────────────────────────
    # Detrás del mismo dominio/TLS que portal y API — nunca un puerto nuevo
    # (mismo principio de "un solo puerto 443" que ya documenta este
    # sistema frente a HP SDS). Si el perfil no está levantado, esta
    # location devuelve 502 (DNS de Docker no resuelve `grafana`) — no
    # rompe nada del resto del sitio.
    location /grafana/ {
      # CSP propia: la del server (arriba) es intencionalmente estricta
      # para portal/API y rompe el JS inline que usa la UI de Grafana. Un
      # `add_header` en un location REEMPLAZA (no suma) los del server, así
      # que hay que repetir acá los headers que sí siguen aplicando.
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Content-Type-Options    "nosniff" always;
      add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

      set                    $grafana_upstream grafana:3000;
      proxy_pass             http://$grafana_upstream;
      proxy_http_version     1.1;
      proxy_set_header       Upgrade    $http_upgrade;
      proxy_set_header       Connection "upgrade";
      proxy_set_header       Host              $host;
      proxy_set_header       X-Real-IP         $remote_addr;
      proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto $scheme;
    }
  }
}
