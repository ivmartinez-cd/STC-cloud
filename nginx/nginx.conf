# STC Cloud — configuración base del reverse proxy de docker-compose.prod.yml.
#
# Este archivo NO tiene bloques `server`: los renderiza `nginx/entrypoint.sh` al
# arrancar el contenedor a partir de `nginx/templates/<modo>.conf.template`
# (sustituyendo ${DOMAIN}) y los deja en /etc/nginx/stc.d/. El modo lo define
# `COMPOSE_PROFILES` en .env.production:
#
#   letsencrypt → 80 (ACME + redirect) y 443 con certificados de Let's Encrypt
#   external    → sólo 80, detrás de un reverse proxy externo que termina TLS
#
# Lo que comparten ambos modos (locations de portal/API/WS/Grafana, cabeceras
# de seguridad, parámetros TLS, gateway EWS) vive en `nginx/snippets/`.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ─── Logging ─────────────────────────────────────────────────────────────
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # Ocultar versión de nginx
  server_tokens off;

  # Límites de request
  client_max_body_size 2m;

  # DNS embebido de Docker — necesario para que `proxy_pass` con variable
  # (ver snippets/app-locations.conf) vuelva a resolver `api`/`portal` cada
  # 10s en vez de resolverlos UNA sola vez al arrancar nginx. Sin esto, con >1
  # réplica de `api` (Fase 16 del gap analysis, `API_REPLICAS` en
  # `.env.production`) nginx fija para siempre la IP que le tocó a la
  # primera resolución — nunca reparte entre réplicas nuevas, y un restart
  # de cualquier contenedor (IP nueva) deja 502 hasta un `nginx -s reload`
  # manual. Con la variable, cada request vuelve a resolver: reparte entre
  # réplicas y sobrevive restarts sin intervención.
  #
  # No declarar otro `resolver` dentro de un bloque `server`: lo REEMPLAZA
  # (no lo complementa) y rompe el proxy_pass dinámico — pasó en el primer
  # despliegue real (10/09/2026): nginx resolvía "portal" contra Google DNS
  # y daba 502 "Host not found".
  resolver 127.0.0.11 valid=10s;

  # Rate limit para rutas de autenticación. En modo `external` el
  # $binary_remote_addr ya es la IP real del cliente gracias al módulo
  # real_ip (ver templates/external.conf.template) — sin eso todos los
  # clientes compartirían la IP del proxy y el límite sería global.
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

  # Bloques `server` renderizados por entrypoint.sh según el modo.
  include /etc/nginx/stc.d/*.conf;
}
