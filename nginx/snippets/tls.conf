# Parámetros TLS comunes a los bloques `listen 443 ssl` del modo letsencrypt
# (portal y gateway EWS). Los `ssl_certificate*` van en cada template porque
# dependen del hostname.
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
ssl_prefer_server_ciphers off;

# SSL session cache
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP Stapling. Usa el `resolver 127.0.0.11` del bloque http (DNS de
# Docker, que reenvía al DNS del host) — NO declarar un resolver externo acá,
# ver el comentario en nginx.conf.
ssl_stapling        on;
ssl_stapling_verify on;
