# Gateway de EWS remoto — contenido del bloque `server` de `ews.<dominio>`.
#
# Hostname APARTE del portal, a propósito: lo que se sirve acá es la web
# embebida de una impresora del cliente. Con origen propio, las rutas
# absolutas del firmware (`/sws/app/…`) resuelven solas y no hay que
# reescribir su HTML ni su JavaScript; y sus cookies no comparten jar con
# las del portal. Ver cloud/src/modules/agents/presentation/ews-gateway-routes.ts
#
# Necesita su propio registro DNS (`ews.<dominio>` → misma IP, o el mismo
# proxy externo en modo `external`). La API tiene que conocer la URL pública
# en `EWS_GATEWAY_URL` (.env.production).
#
# Deliberadamente SIN las cabeceras de seguridad del portal: acá el HTML lo
# genera el firmware del equipo y una CSP nuestra le rompería la página. El
# aislamiento lo da el origen propio, no las cabeceras.

# El agente ya corta en 2 MB lo que VUELVE del equipo; este tope es para
# lo que el operador ENVÍA (formularios del EWS).
client_max_body_size 4m;

location / {
  set $api_upstream api:3000;
  # `rewrite … break` y no la forma `proxy_pass http://$up/__ews/`: con
  # variables en proxy_pass, nginx NO hace la sustitución de prefijo y
  # pasaría el URI tal cual. Así queda determinístico.
  rewrite ^(.*)$ /__ews$1 break;
  proxy_pass         http://$api_upstream;
  include            /etc/nginx/snippets/proxy-headers.conf;
  # Cada petición viaja nube → agente → impresora; el relay espera hasta
  # 20 s al agente. 60 s deja margen sin colgar el worker de nginx.
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
}
