# Cabeceras de seguridad del portal/API. Se incluyen a nivel `server` del
# bloque principal en ambos modos. En modo `external` el proxy de adelante
# las reenvía tal cual al navegador (HSTS sólo tiene efecto sobre HTTPS, que
# es lo que el proxy externo debe ofrecer — ver .env.production.example).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options           "DENY"    always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-XSS-Protection          "1; mode=block" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self'" always;
