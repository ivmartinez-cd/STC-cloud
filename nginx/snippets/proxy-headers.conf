# Cabeceras que viajan al upstream (api/portal/grafana). Se incluye dentro de
# cada `location` que hace proxy_pass.
#
# $stc_proto lo define cada template según el modo: `$scheme` cuando este
# nginx termina TLS (letsencrypt), o el X-Forwarded-Proto que manda el proxy
# externo (external). Así la API ve "https" en ambos casos.
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $stc_proto;
