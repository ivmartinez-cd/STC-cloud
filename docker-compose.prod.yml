# STC Cloud — Docker Compose de Producción
# Uso: docker compose -f docker-compose.prod.yml up -d --build

services:
  # ─── Backend API (Fastify + TypeScript) ────────────────────────────────────
  api:
    build:
      context: ./cloud
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stc-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      # Réplicas reales (Fase 16 del gap analysis, 26/08/2026) — default 1,
      # cero cambio de comportamiento hasta que se suba `API_REPLICAS` en
      # `.env.production`. Seguro para escalar recién desde la Fase 15: sin
      # el relay Redis del proxy EWS, una réplica que no tuviera el socket
      # WSS del agente fallaba 503 aunque el agente estuviera conectado a
      # otra; el resto (WS de portal, jobs `setInterval`) ya era
      # replica-safe desde la Fase 5 (advisory locks + pub/sub). Sin
      # `container_name` en este archivo (a diferencia del compose de
      # dev/`docker-compose.yml`) — es lo que permite `replicas > 1` acá.
      # Antes de subir `API_REPLICAS`, revisar `DB_POOL_MAX` en
      # `.env.production`: cada réplica abre su propio pool de Knex contra
      # el mismo Postgres, y la suma no debe superar `max_connections`.
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # ─── Portal Web (React + Vite → nginx) ────────────────────────────────────
  portal:
    build:
      context: ./cloud/portal
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - stc-network
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  # ─── Base de datos (PostgreSQL 16 + TimescaleDB) ──────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-stc_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-stc_cloud}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-stc_admin} -d ${DB_NAME:-stc_cloud}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stc-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ─── Cache y cola de comandos ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stc-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # ─── Reverse Proxy (nginx + SSL) ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # Recarga cada 6 h para tomar los certificados que certbot renueva: nginx
    # lee los PEM sólo al arrancar, y sin esto seguía sirviendo el certificado
    # viejo hasta vencer aunque el nuevo ya estuviera en disco (auditoría 14/09/2026).
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      # Paquetes de actualización del agente publicados por
      # installer/publish-release.sh (bind mount, no volumen nombrado: así
      # publicar es un scp directo a ./agent-updates en el host, sin entrar
      # a ningún contenedor). Ver location /updates/ en nginx.conf.
      - ./agent-updates:/var/www/updates:ro
    depends_on:
      api:
        condition: service_healthy
      portal:
        condition: service_healthy
    networks:
      - stc-network
    healthcheck:
      # Chequeo de puerto, no de contenido: nginx.conf hace redirect/SSL propios
      # que dependen del dominio y certificado reales, fuera de alcance acá.
      # 127.0.0.1 y no `localhost`: en nginx:alpine `localhost` resuelve a `::1`
      # y nginx.conf escucha sólo IPv4 (`listen 80;`), así que el chequeo daba
      # siempre 1 y el contenedor figuraba unhealthy desde el arranque (11/09/2026).
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  # ─── Certbot — renovación automática SSL (cada 12h) ──────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.1"

  # ─── Backup automático PostgreSQL — diario, retención 30 días ─────────────
  backup:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    volumes:
      - backups:/backups
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          OUT=/backups/stc_$$(date +%Y%m%d_%H%M).sql.gz
          pg_dump -h postgres -U $${DB_USER:-stc_admin} $${DB_NAME:-stc_cloud} | gzip > "$$OUT"
          # Un dump que falla deja un .gz de ~20 bytes (pasó el 10/09/2026 y nadie
          # lo vio): se borra y se avisa fuerte, en vez de guardar un backup vacío.
          if [ "$$(stat -c %s "$$OUT")" -lt 1024 ]; then
            echo "[Backup] ERROR: dump vacío o fallido ($$OUT), descartado"; rm -f "$$OUT"
          else
            echo "[Backup] Completado: $$OUT ($$(stat -c %s "$$OUT") bytes)"
          fi
          find /backups -name "*.sql.gz" -mtime +30 -delete
          sleep 86400 & wait $${!}
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stc-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # ─── Observabilidad (Fase 17 del gap analysis, 26/08/2026) — OPCIONAL ─────
  # Perfil `observability`: no arranca con `docker compose up -d` normal.
  # Levantar con:
  #   docker compose -f docker-compose.prod.yml --env-file .env.production \
  #     --profile observability up -d
  # Prometheus/Alertmanager quedan SIN puerto publicado ni location de
  # nginx a propósito — mismo criterio de confianza que ya documentaba
  # `metrics/http-metrics.ts` para `/metrics` (red interna de
  # `stc-network`, sin exposición externa). Grafana SÍ se expone, pero
  # detrás del mismo nginx/TLS que portal y API (`/grafana/`, ver
  # `nginx.conf`) — nunca un puerto nuevo — y tiene su propio login.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    networks:
      - stc-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - stc-network
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      # CAMBIAR en .env.production — mismo criterio que el resto de este
      # archivo (PORTAL_ADMIN_PASSWORD, DB_PASSWORD): se commitea con un
      # default obvio, nunca con un secreto real.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CAMBIAR_POR_CONTRASENA_SEGURA}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Servido bajo /grafana/ en el mismo dominio — ver nginx.conf.
      GF_SERVER_ROOT_URL: "https://${DOMAIN}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - stc-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

volumes:
  pgdata:
  redisdata:
  certbot-certs:
  certbot-www:
  backups:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  stc-network:
    driver: bridge
