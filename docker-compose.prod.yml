# STC Cloud — Docker Compose de Producción
# Uso: docker compose -f docker-compose.prod.yml up -d --build

services:
  # ─── Backend API (Fastify + TypeScript) ────────────────────────────────────
  api:
    build:
      context: ./cloud
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stc-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      # Réplicas reales (Fase 16 del gap analysis, 26/08/2026) — default 1,
      # cero cambio de comportamiento hasta que se suba `API_REPLICAS` en
      # `.env.production`. Seguro para escalar recién desde la Fase 15: sin
      # el relay Redis del proxy EWS, una réplica que no tuviera el socket
      # WSS del agente fallaba 503 aunque el agente estuviera conectado a
      # otra; el resto (WS de portal, jobs `setInterval`) ya era
      # replica-safe desde la Fase 5 (advisory locks + pub/sub). Sin
      # `container_name` en este archivo (a diferencia del compose de
      # dev/`docker-compose.yml`) — es lo que permite `replicas > 1` acá.
      # Antes de subir `API_REPLICAS`, revisar `DB_POOL_MAX` en
      # `.env.production`: cada réplica abre su propio pool de Knex contra
      # el mismo Postgres, y la suma no debe superar `max_connections`.
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # ─── Portal Web (React + Vite → nginx) ────────────────────────────────────
  portal:
    build:
      context: ./cloud/portal
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - stc-network
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  # ─── Base de datos (PostgreSQL 16 + TimescaleDB) ──────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-stc_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-stc_cloud}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-stc_admin} -d ${DB_NAME:-stc_cloud}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stc-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ─── Cache y cola de comandos ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stc-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # ─── Reverse Proxy (nginx + SSL) ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      portal:
        condition: service_healthy
    networks:
      - stc-network
    healthcheck:
      # Chequeo de puerto, no de contenido: nginx.conf hace redirect/SSL propios
      # que dependen del dominio y certificado reales, fuera de alcance acá.
      test: ["CMD-SHELL", "nc -z localhost 80"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  # ─── Certbot — renovación automática SSL (cada 12h) ──────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.1"

  # ─── Backup automático PostgreSQL — diario, retención 30 días ─────────────
  backup:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    volumes:
      - backups:/backups
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          pg_dump -h postgres -U $${DB_USER:-stc_admin} $${DB_NAME:-stc_cloud} \
            | gzip > /backups/stc_$$(date +%Y%m%d_%H%M).sql.gz
          find /backups -name "*.sql.gz" -mtime +30 -delete
          echo "[Backup] Completado: $$(date)"
          sleep 86400 & wait $${!}
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stc-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

volumes:
  pgdata:
  redisdata:
  certbot-certs:
  certbot-www:
  backups:

networks:
  stc-network:
    driver: bridge
