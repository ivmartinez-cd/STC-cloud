name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Portal (React + Vite) ─────────────────────────────────────────────────
  portal:
    name: Portal — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cloud/portal/package-lock.json

      - run: npm ci
      - run: npm run check    # ESLint + TypeScript + icon validation
      - run: npm test         # lógica pura del portal (parseRanges)
      - run: npm run build

  # ─── Arquitectura — guardas estáticas de docs/dev/ARCHITECTURE_GUIDE.md ──────
  # Fase 5 del plan de migración: bloquean (ratchet contra baseline) tamaños de
  # archivo/función (check-sizes) y reglas de dependencias entre capas/módulos/
  # features, console.log, catch silenciosos y SQL interpolado (check-guards) y
  # que toda ruta declare su autenticación o esté en la allowlist pública (check-routes).
  # No necesita Postgres ni Redis: corre rápido y en paralelo a los otros jobs.
  arch:
    name: Arquitectura — límites de tamaño y guardas de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run check:arch -w cloud

  # ─── API (Fastify + TypeScript) — build + tests de integración reales ─────
  api:
    name: API — typecheck, build & tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: stc_admin
          POSTGRES_PASSWORD: stc_secret
          POSTGRES_DB: stc_cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stc_admin -d stc_cloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_USER: stc_admin
      DB_PASSWORD: stc_secret
      DB_NAME: stc_cloud
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: una_clave_super_secreta_de_al_menos_32_caracteres_para_ci
      # Cifra secretos (credenciales SNMP, SFTP y — desde twoFactor.test.ts —
      # el totp_secret de 2FA) vía HKDF; sin ella encryptSecret() tira
      # MissingEncryptionKeyError y cualquier ruta que la use responde 500.
      SNMP_CREDENTIALS_KEY: una_clave_de_cifrado_cualquiera_para_ci
      PORTAL_ADMIN_USER: admin
      PORTAL_ADMIN_PASSWORD: Admin1234
      API_URL: http://localhost:3000/api/v1
      PORT: "3000"
      # rbac.test.ts/alerts.test.ts/clientDirectory.test.ts/clientDeviceDirectory.test.ts
      # /deviceDetail.test.ts/monitorDetail.test.ts abren una conexión pg propia
      # (fuera de la app) para probar cosas que la API no expone (CHECK
      # constraints, LEFT JOIN crudo) — por defecto asumen el mapeo de puerto
      # no estándar del docker-compose local (5434→5432); acá el service de
      # Postgres publica el puerto estándar, así que hay que pisar el default
      # explícitamente. Si falta una, el test no falla por assertion: tira
      # ECONNREFUSED en el hook y cancela todos sus subtests.
      #
      # Toda var `*_TEST_DB_PORT` que use un test tiene que estar acá. Para
      # chequearlo:
      #   grep -rho 'process\.env\.[A-Z_]*TEST_DB_PORT' cloud/src/tests | sort -u
      RBAC_TEST_DB_PORT: "5432"
      ALERTS_TEST_DB_PORT: "5432"
      CLIENT_DIRECTORY_TEST_DB_PORT: "5432"
      DEVICE_DETAIL_TEST_DB_PORT: "5432"
      MONITOR_DETAIL_TEST_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build -w cloud

      - name: Iniciar API en background (migra + bootstrap admin en el boot)
        working-directory: cloud
        env:
          NODE_V8_COVERAGE: /tmp/v8-coverage   # ver check-coverage.mjs (Fase 5, cobertura por capa)
        run: |
          node --enable-source-maps dist/api/server.js &
          echo $! > /tmp/api.pid

      - name: Esperar a que /health responda
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "API lista"
              exit 0
            fi
            sleep 1
          done
          echo "La API no respondió /health a tiempo"
          exit 1

      - name: Seed mínimo (e2e.test.ts necesita al menos un cliente existente)
        run: npm run seed -w cloud

      - name: Tests de integración (flush de Redis entre archivos — ver ci-test-runner.mjs)
        working-directory: cloud
        env:
          # Los tests unitarios (domain/application con fakes) corren en el proceso
          # del runner, no en la API: sin esto su cobertura no contaría (check-coverage.mjs).
          NODE_V8_COVERAGE: /tmp/v8-coverage
        run: node scripts/ci-test-runner.mjs

      - name: Detener API (SIGTERM → cierre ordenado → V8 vuelca el coverage)
        if: always()
        run: |
          PID="$(cat /tmp/api.pid)"
          kill "$PID" 2>/dev/null || true
          for i in $(seq 1 30); do kill -0 "$PID" 2>/dev/null || break; sleep 1; done

      - name: Cobertura mínima por capa (docs/dev/ARCHITECTURE_GUIDE.md)
        working-directory: cloud
        run: NODE_V8_COVERAGE=/tmp/v8-coverage node scripts/check-coverage.mjs

  # ─── Agent (SNMP scanner → runtime embebido Windows) ──────────────────────
  agent:
    name: Agent — build, test, bundle (SEA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build -w agent
      - run: npm test -w agent    # suite completa (ver agent/package.json script "test")

      # R6 del gap analysis vs HP SDS: hasta acá CI empaquetaba con `pkg`
      # (`npx pkg ... --output dist/STCCloudMonitor.exe`), un artefacto que
      # NINGÚN instalador real usa — `installer/build-installer.bat` arma el
      # release real con `agent/build-sea.js` (bundle esbuild + runtime de
      # Node copiado) + Inno Setup, en Windows. "CI construye el de pkg; el
      # instalador empaqueta el de esbuild" (CI no producía lo que se
      # instala). Se reemplaza por el bundling REAL (`build-sea.js`): el
      # paso que copia `process.execPath` como `stc-node.exe` no produce un
      # binario Windows válido corriendo en `ubuntu-latest` (no hay forma de
      # validar eso sin un runner Windows), pero el bundling con esbuild —la
      # parte que de verdad se rompe cuando cambia un import, un módulo
      # nativo mal externalizado, etc.— es JS puro y sí se valida acá, en
      # cualquier plataforma. `dist/bundle.js` es justamente lo que el
      # instalador firma y distribuye.
      - name: Bundle real (esbuild, el mismo que usa el instalador)
        working-directory: agent
        run: node build-sea.js

      - name: Upload bundle.js (artefacto real que firma/distribuye el instalador)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: stc-agent-bundle-${{ github.sha }}
          path: agent/dist/bundle.js
          retention-days: 30
